<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departemen Kebersihan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-sky-200">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-y-[-150%] transition-transform duration-300 bg-slate-900/95 backdrop-blur text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-bold border border-slate-700">
    <i class="fa-solid fa-circle-check text-green-400 text-lg"></i>
    <span id="toastMsg">Berhasil!</span>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-sm border-b border-slate-200 px-4 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-sky-100 text-sky-600 p-2 rounded-xl">
          <i class="fa-solid fa-hands-bubbles text-lg"></i>
        </div>
        <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">Departemen Kebersihan</h1>
      </div>
      <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md shadow-sky-200 transition-all active:scale-95 shrink-0 flex items-center gap-1.5">
        <i class="fa-solid fa-plus"></i> Tambah
      </button>
    </div>
  </header>

  <main class="p-4 max-w-2xl mx-auto pb-20">
    
    <!-- Bagian Pencarian & Filter -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-5">
      <div class="flex gap-2 mb-3">
        <div class="relative flex-1 group">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 group-focus-within:text-sky-500 transition-colors">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
          </div>
          <input type="text" id="search" oninput="renderData()" class="bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-2 focus:ring-sky-100 focus:border-sky-500 block w-full pl-10 p-3 transition-all outline-none" placeholder="Cari nama barang, lokasi, atau peminjam...">
        </div>
        <div class="flex bg-slate-100 p-1.5 rounded-xl shrink-0 gap-1 items-center">
          <button onclick="setViewMode('grid')" id="btnGridView" class="w-10 h-10 flex items-center justify-center rounded-lg text-sm font-bold bg-white text-sky-600 shadow-sm transition-all"><i class="fa-solid fa-border-all"></i></button>
          <button onclick="setViewMode('list')" id="btnListView" class="w-10 h-10 flex items-center justify-center rounded-lg text-sm font-bold text-slate-400 hover:text-slate-600 transition-all"><i class="fa-solid fa-list-ul"></i></button>
        </div>
      </div>

      <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
        <button onclick="setCategory('Semua', this)" class="cat-chip cat-active px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-sky-600 text-white shadow-sm shadow-sky-200 transition-all">Semua</button>
        <button onclick="setCategory('Alat / Sabun', this)" class="cat-chip px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 transition-all">Alat / Sabun</button>
        <button onclick="setCategory('Habis Pakai', this)" class="cat-chip px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 transition-all">Habis Pakai</button>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="flex flex-col items-center justify-center py-16">
      <div class="w-12 h-12 border-4 border-slate-100 border-t-sky-500 rounded-full animate-spin mb-4"></div>
      <p class="text-slate-500 font-medium text-sm animate-pulse">Menghubungkan ke Master Data...</p>
    </div>

    <!-- Data Container -->
    <div id="content" class="space-y-4"></div>
  </main>

  <!-- Modal Tambah Barang Baru -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] overflow-y-auto transform transition-all">
      <div class="flex justify-between items-center mb-5">
        <div class="flex items-center gap-2">
          <div class="bg-green-100 text-green-600 p-2 rounded-lg"><i class="fa-solid fa-box-open"></i></div>
          <h3 class="text-base font-extrabold text-slate-800">Barang Baru</h3>
        </div>
        <button onclick="closeAddModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="addItemForm" onsubmit="submitNewItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Nama Barang</label>
          <input type="text" id="newName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Kategori</label>
            <select id="newCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
              <option value="Alat / Sabun">Alat / Sabun</option>
              <option value="Habis Pakai">Habis Pakai</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Lokasi / Box</label>
            <input type="text" id="newLocation" placeholder="Contoh: Box 1" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Total Stok</label>
            <input type="number" id="newTotal" required value="1" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Satuan</label>
            <input type="text" id="newUnit" placeholder="pcs/botol" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Keterangan Tambahan</label>
          <input type="text" id="newDesc" placeholder="Opsional..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none transition-all">
        </div>
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-sky-200 transition-all active:scale-95">Simpan ke Master Data</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Peminjaman Barang (Dengan Input Qty) -->
  <div id="pinjamModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform transition-all">
      <div class="flex justify-between items-start mb-4">
        <div>
           <div id="pinjamIcon" class="w-10 h-10 rounded-full flex items-center justify-center mb-2"></div>
           <h3 class="text-base font-extrabold text-slate-800" id="pinjamTitle">Konfirmasi</h3>
        </div>
        <button onclick="closePinjamModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form onsubmit="submitPinjam(event)">
        <input type="hidden" id="pinjamItemId">
        <input type="hidden" id="pinjamAksi"> <!-- 1 atau -1 -->
        
        <p class="text-sm text-slate-600 mb-5 leading-relaxed" id="pinjamDesc"></p>
        
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-4 mb-5">
           <!-- INPUT QTY -->
           <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Jumlah Barang</label>
              <div class="flex items-center gap-3">
                 <input type="number" id="pinjamQty" value="1" min="1" required class="w-24 text-center bg-white border border-slate-200 rounded-xl p-2.5 text-base font-bold text-slate-800 focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none">
                 <span id="pinjamSatuan" class="text-sm font-semibold text-slate-400">pcs</span>
              </div>
           </div>

           <!-- INPUT NAMA -->
           <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5" id="labelNamaPeminjam">Nama Kru</label>
              <select id="pinjamNamaSelect" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none mb-2">
                 <option value="">-- Pilih Nama --</option>
              </select>
              <div class="relative">
                 <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-300"><i class="fa-regular fa-keyboard"></i></div>
                 <input type="text" id="pinjamNamaInput" placeholder="Atau ketik manual..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 p-3 text-sm focus:ring-2 focus:ring-sky-100 focus:border-sky-500 outline-none">
              </div>
           </div>
        </div>

        <button type="submit" id="pinjamSubmitBtn" class="w-full text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition-all active:scale-95">Konfirmasi</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
