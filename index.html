<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kebersihan CABR</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS Kustom -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Header Sticky -->
  <header class="sticky top-0 z-50 bg-white shadow-sm border-b border-slate-200 px-4 py-3">
    <div class="flex items-center justify-between mb-3">
      <h1 class="text-xl font-bold text-sky-700"><i class="fa-solid fa-leaf mr-2"></i>Dep. Kebersihan</h1>
      <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all">
        <i class="fa-solid fa-plus mr-1"></i> Tambah Barang
      </button>
    </div>
    
    <!-- Tab Navigasi -->
    <div class="flex gap-2">
      <button id="tab-inventaris" onclick="switchTab('inventaris')" class="tab-btn tab-active flex-1 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        <i class="fa-solid fa-box-open mr-1"></i> Stok
      </button>
      <button id="tab-jadwal" onclick="switchTab('jadwal')" class="tab-btn tab-inactive flex-1 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        <i class="fa-solid fa-clipboard-list mr-1"></i> Tugas
      </button>
      <button id="tab-relawan" onclick="switchTab('relawan')" class="tab-btn tab-inactive flex-1 py-2 rounded-lg font-semibold text-sm transition-all duration-200">
        <i class="fa-solid fa-users mr-1"></i> Tim
      </button>
    </div>
  </header>

  <main class="p-4 max-w-2xl mx-auto">
    <!-- Kotak Pencarian -->
    <div class="relative mb-5">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <input type="text" id="search" oninput="renderData()" class="bg-white border border-slate-200 text-slate-900 text-sm rounded-xl focus:ring-sky-500 focus:border-sky-500 block w-full pl-10 p-3 shadow-sm" placeholder="Cari barang, box, lokasi...">
    </div>

    <!-- Status Loading -->
    <div id="loading" class="flex flex-col items-center justify-center py-12">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-10 w-10 mb-4"></div>
      <p class="text-slate-500 font-medium text-sm">Menghubungkan ke Database...</p>
    </div>

    <!-- Kontainer Data -->
    <div id="content" class="space-y-4"></div>
  </main>

  <!-- Modal Tambah Barang & Kompres Foto -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">Tambah Barang Baru</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
      </div>
      
      <form id="addItemForm" onsubmit="submitNewItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Barang</label>
          <input type="text" id="newName" required class="w-full border border-slate-200 rounded-lg p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Kategori</label>
            <select id="newCategory" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white">
              <option value="Alat / Sabun">Alat / Sabun</option>
              <option value="Habis Pakai">Habis Pakai</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Lokasi / Box</label>
            <input type="text" id="newLocation" placeholder="Contoh: Box 1" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Total Stok</label>
            <input type="number" id="newTotal" required value="1" min="1" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Satuan</label>
            <input type="text" id="newUnit" placeholder="pcs / botol / pack" required class="w-full border border-slate-200 rounded-lg p-2.5 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Upload Foto (Kamera / Galeri HP)</label>
          <input type="file" id="newPhoto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
          <p class="text-[10px] text-slate-400 mt-1">Foto akan otomatis dikompres agar ringan saat diunggah.</p>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Keterangan</label>
          <input type="text" id="newDesc" placeholder="Catatan tambahan..." class="w-full border border-slate-200 rounded-lg p-2.5 text-sm">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2.5 rounded-lg text-sm">Batal</button>
          <button type="submit" id="submitBtn" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panggil File JavaScript Terpisah -->
  <script src="js/app.js"></script>
</body>
</html>
