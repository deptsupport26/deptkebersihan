<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Kebersihan CABR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="toast" class="fixed top-4 right-4 z-50 transform translate-y-[-150%] transition-transform duration-300 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2 text-xs font-bold">
    <i class="fa-solid fa-circle-check text-green-400"></i>
    <span id="toastMsg">Berhasil!</span>
  </div>

  <header class="sticky top-0 z-40 bg-white shadow-sm border-b border-slate-200 px-4 py-3">
    <div class="flex items-center justify-between mb-3">
      <h1 class="text-base font-bold text-sky-700 truncate"><i class="fa-solid fa-leaf mr-1"></i>Dep. Kebersihan</h1>
      <button onclick="openAddModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all shrink-0">
        <i class="fa-solid fa-plus mr-1"></i> Tambah
      </button>
    </div>
    
    <div class="flex gap-2">
      <button id="tab-inventaris" onclick="switchTab('inventaris')" class="tab-btn tab-active flex-1 py-1.5 rounded-lg font-semibold text-xs transition-all duration-200">
        <i class="fa-solid fa-box-open mr-1"></i> Stok
      </button>
      <button id="tab-jadwal" onclick="switchTab('jadwal')" class="tab-btn tab-inactive flex-1 py-1.5 rounded-lg font-semibold text-xs transition-all duration-200">
        <i class="fa-solid fa-clipboard-list mr-1"></i> Tugas
      </button>
      <button id="tab-relawan" onclick="switchTab('relawan')" class="tab-btn tab-inactive flex-1 py-1.5 rounded-lg font-semibold text-xs transition-all duration-200">
        <i class="fa-solid fa-users mr-1"></i> Tim
      </button>
    </div>
  </header>

  <main class="p-3 max-w-xl mx-auto">
    <div class="flex gap-2 mb-3" id="searchFilterContainer">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </div>
        <input type="text" id="search" oninput="renderData()" class="bg-white border border-slate-200 text-slate-900 text-xs rounded-xl focus:ring-sky-500 focus:border-sky-500 block w-full pl-9 p-2.5 shadow-sm" placeholder="Cari barang, peminjam...">
      </div>
      <div class="flex bg-slate-200 p-1 rounded-xl shrink-0" id="viewToggleGroup">
        <button onclick="setViewMode('grid')" id="btnGridView" class="px-3 py-1 rounded-lg text-xs font-bold bg-white text-sky-700 shadow-sm transition-all"><i class="fa-solid fa-border-all"></i></button>
        <button onclick="setViewMode('list')" id="btnListView" class="px-3 py-1 rounded-lg text-xs font-bold text-slate-500 transition-all"><i class="fa-solid fa-list"></i></button>
      </div>
    </div>

    <div id="categoryFilterContainer" class="flex gap-1.5 overflow-x-auto pb-2 mb-3 scrollbar-none">
      <button onclick="setCategory('Semua', this)" class="cat-chip cat-active px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap bg-sky-600 text-white shadow-sm">Semua</button>
      <button onclick="setCategory('Alat / Sabun', this)" class="cat-chip px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200">Alat / Sabun</button>
      <button onclick="setCategory('Habis Pakai', this)" class="cat-chip px-3 py-1 rounded-full text-[11px] font-bold whitespace-nowrap bg-white text-slate-600 border border-slate-200">Habis Pakai</button>
    </div>

    <div id="loading" class="flex flex-col items-center justify-center py-12">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-8 w-8 mb-3"></div>
      <p class="text-slate-500 font-medium text-xs">Memuat database...</p>
    </div>

    <div id="content" class="space-y-3"></div>
  </main>

  <!-- Modal Tambah Barang Baru (Tanpa Foto) -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-sm font-bold text-slate-800">Tambah Barang Baru</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
      </div>
      <form id="addItemForm" onsubmit="submitNewItem(event)" class="space-y-3">
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Barang</label>
          <input type="text" id="newName" required class="w-full border border-slate-200 rounded-lg p-2 text-xs">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Kategori</label>
            <select id="newCategory" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-white">
              <option value="Alat / Sabun">Alat / Sabun</option>
              <option value="Habis Pakai">Habis Pakai</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Lokasi / Box</label>
            <input type="text" id="newLocation" placeholder="Box 1" class="w-full border border-slate-200 rounded-lg p-2 text-xs">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Stok</label>
            <input type="number" id="newTotal" required value="1" min="1" class="w-full border border-slate-200 rounded-lg p-2 text-xs">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Satuan</label>
            <input type="text" id="newUnit" placeholder="pcs/botol" required class="w-full border border-slate-200 rounded-lg p-2 text-xs">
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Keterangan</label>
          <input type="text" id="newDesc" placeholder="Catatan..." class="w-full border border-slate-200 rounded-lg p-2 text-xs">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg text-xs">Batal</button>
          <button type="submit" id="submitBtn" class="flex-1 bg-sky-600 text-white font-bold py-2 rounded-lg text-xs shadow-sm">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Peminjaman Barang -->
  <div id="pinjamModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-bold text-slate-800">Siapa yang Pakai/Pinjam?</h3>
        <button onclick="closePinjamModal()" class="text-slate-400 text-lg">&times;</button>
      </div>
      <form onsubmit="submitPinjam(event)" class="space-y-3">
        <input type="hidden" id="pinjamItemId">
        <input type="hidden" id="pinjamAksi"> <!-- Nilainya 1 atau -1 -->
        <p class="text-xs text-slate-500 mb-2" id="pinjamDesc">Masukkan nama kru yang memakai barang ini.</p>
        <div>
           <select id="pinjamNamaSelect" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-white mb-2">
              <option value="">-- Pilih dari Daftar Tim --</option>
           </select>
           <p class="text-[10px] text-center text-slate-400 mb-1">Atau ketik nama jika tidak ada di daftar:</p>
           <input type="text" id="pinjamNamaInput" placeholder="Ketik nama manual..." class="w-full border border-slate-200 rounded-lg p-2 text-xs">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closePinjamModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-2 rounded-lg text-xs">Batal</button>
          <button type="submit" id="pinjamSubmitBtn" class="flex-1 bg-sky-600 text-white font-bold py-2 rounded-lg text-xs shadow-sm">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
